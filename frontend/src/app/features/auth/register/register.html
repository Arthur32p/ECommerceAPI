<section class="vh-100">
    <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-lg-12 col-xl-11">
                <div class="card text-black" style="border-radius: 25px;">
                    <div class="card-body p-md-5">
                        <div class="row justify-content-center">
                            <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                                <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Criar Conta</p>

                                <form class="mx-1 mx-md-4" (ngSubmit)="aoCadastrar()">

                                    <div class="d-flex flex-row align-items-center mb-4">
                                        <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                                        <div data-mdb-input-init class="form-outline flex-fill mb-0">
                                            <label class="form-label" for="form3Example1c">Nome</label>
                                            <input type="text" id="name" class="form-control"
                                                [(ngModel)]="registroForm.name" name="name" required />
                                        </div>
                                    </div>

                                    <div class="d-flex flex-row align-items-center mb-4">
                                        <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                                        <div data-mdb-input-init class="form-outline flex-fill mb-0">
                                            <label class="form-label" for="form3Example3c">Email</label>
                                            <input type="email" id="email" class="form-control"
                                                [(ngModel)]="registroForm.email" name="email" required />
                                        </div>
                                    </div>

                                    <div class="d-flex flex-row align-items-center mb-4">
                                        <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                                        <div data-mdb-input-init class="form-outline flex-fill mb-0">
                                            <label class="form-label" for="form3Example4c">Senha</label>
                                            <div class="input-group">
                                                <input [type]="mostrarSenha() ? 'text' : 'password'" id="password"
                                                    class="form-control" [(ngModel)]="registroForm.password"
                                                    name="password" required />
                                                <button class="btn btn-outline-secondary" type="button"
                                                    (click)="toggleMostrarSenha()">
                                                    <i class="fas" [class.fa-eye]="!mostrarSenha()"
                                                        [class.fa-eye-slash]="mostrarSenha()"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                                        <button type="submit" class="btn btn-primary btn-lg">Cadastrar</button>
                                    </div>

                                    @if (mensagemErro()) {
                                    <div class="alert alert-danger mt-3" role="alert">
                                        {{ mensagemErro() }}
                                    </div>
                                    }

                                    <div class="text-center mt-3">
                                        <small>Já possui uma conta? <a routerLink="/login">Faça Login</a></small>
                                    </div>

                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
