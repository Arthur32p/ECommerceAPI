  server:
    servlet:
      context-path: /api/v1

  spring:
    application:
      name: ECommerceAPI
    datasource:
      url: jdbc:postgresql://localhost:5432/ecommerce_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: validate
    flyway:
      enabled: true
      locations: classpath:db/migration

  api:
    security:
      token:
        secret: ${JWT_SECRET:my-secret-key}

  aws:
    s3:
      endpoint-url: http://localhost:9000
      region: us-east-1
      access-key: admin
      secret-key: password123
      bucket-name: produtos

  stripe:
    api-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    success-url: "http://localhost:8080/swagger-ui/index.html?status=sucesso"
    cancel-url: "http://localhost:8080/swagger-ui/index.html?status=cancelado"